<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookBuddy · Читалня нощем</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#d8d4e2;color:#252037;font:14px/1.5 system-ui,"Segoe UI","Noto Sans",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button,h1,h2,h3,h4,p,figure,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img,svg{display:block}
button svg,span svg,.icon{flex:none}
.icon{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.spine-book:focus-visible{
  outline:2px solid var(--focus,#624ba6);outline-offset:3px}

/* Review chrome */
.review{max-width:1400px;margin:0 auto;padding:16px 24px 10px;display:flex;gap:20px;align-items:center;justify-content:space-between}
.review-title{font:650 18px/1.15 Georgia,"Times New Roman","Noto Serif",serif;letter-spacing:-.03em}
.review-title span{display:block;margin-top:2px;font:550 12px/1.3 system-ui,"Segoe UI",sans-serif;letter-spacing:0;color:#5a5368}
.switch{display:flex;gap:3px;padding:4px;background:#f4f2f8;border:1px solid #d4d0dc;border-radius:9px}
.switch button{min-height:38px;padding:5px 12px;border:0;color:#4f4863;background:none;border-radius:6px;font-weight:650}
.switch button[aria-pressed=true]{background:#322452;color:#fff}
.stage{max-width:1320px;margin:0 auto 28px;width:calc(100% - 40px);container-type:inline-size;position:relative;border:1px solid #cfc9db;border-radius:14px;overflow:clip;box-shadow:0 18px 50px #1a123028;isolation:isolate;background:#fff}
.stage.phone{width:min(390px,calc(100% - 24px));border-radius:16px}

.app{
  --paper:#fbfafd;--panel:#ffffff;--soft:#ece8f4;--line:#d8d3e3;
  --ink:#221832;--mute:#534b63;--primary:#41316c;--on-primary:#fff;
  --gold:#76591c;--gold-line:#ac8b4d;--focus:#624ba6;--fill:#5b468a;
  --nav:#fbfafd;--art:#1c1730;--cloth:#3a2b5c;--cloth-2:#2d2148;
  --foil:#b08a3a;--sheet:#f3f1f8;--page-edge:#eceaf3;
  --well:#2a243c;--plank:#3a3348;--plank-edge:#241e32;--plank-shine:#5a5368;
  --ribbon:#5c2a44;--lamp:226,196,131;
  --wall:#241e34;--cornice:#3a334c;
  --display:Georgia,"Times New Roman","Liberation Serif","Noto Serif",serif;
  --sans:system-ui,"Segoe UI","Noto Sans",Arial,sans-serif;
  min-height:780px;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);
  display:flex;flex-direction:column;position:relative;
}
.app.dark{
  --paper:#0f0c16;--panel:#1a1526;--soft:#241c34;--line:#3a3148;
  --ink:#f3eff8;--mute:#b9b1c8;--primary:#dfcff8;--on-primary:#281b3e;
  --gold:#e2c483;--gold-line:#b49658;--focus:#d8bbff;--fill:#c1a8ec;
  --nav:#120e1a;--art:#0c0912;--cloth:#2a1e44;--cloth-2:#1d1530;
  --foil:#e2c483;--sheet:#241c34;--page-edge:#3a3148;
  --well:#14101f;--plank:#3e3854;--plank-edge:#1b1728;--plank-shine:#6a6480;
  --ribbon:#8a4564;--lamp:226,196,131;
  --wall:#12101a;--cornice:#2a2438;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  .app.system{
    --paper:#0f0c16;--panel:#1a1526;--soft:#241c34;--line:#3a3148;
    --ink:#f3eff8;--mute:#b9b1c8;--primary:#dfcff8;--on-primary:#281b3e;
    --gold:#e2c483;--gold-line:#b49658;--focus:#d8bbff;--fill:#c1a8ec;
    --nav:#120e1a;--art:#0c0912;--cloth:#2a1e44;--cloth-2:#1d1530;
    --foil:#e2c483;--sheet:#241c34;--page-edge:#3a3148;
    --well:#14101f;--plank:#3e3854;--plank-edge:#1b1728;--plank-shine:#6a6480;
    --ribbon:#8a4564;--lamp:226,196,131;
    --wall:#12101a;--cornice:#2a2438;
    color-scheme:dark;
  }
}

/* Nav */
.nav{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4%;border-bottom:1px solid var(--line);background:var(--nav);gap:12px;z-index:4}
.brand{display:inline-flex;align-items:baseline;gap:12px;border:0;background:none;color:var(--ink);padding:0;text-align:left}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:2px;background:var(--primary);color:var(--on-primary);align-self:center}
.brand-mark .icon{width:15px;height:15px}
.brand-name{font:700 22px/1 var(--display);letter-spacing:-.04em}
.brand-sub{font:700 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.navlinks,.navactions,.actions,.filters{display:flex;gap:6px;align-items:center}
.navactions{justify-content:flex-end;gap:8px}
.navlink{color:var(--mute);border:0;background:none;min-height:44px;padding:0 11px;font-weight:650;position:relative;white-space:nowrap}
.navlink.current{color:var(--ink)}
.navlink.current:after{content:"";height:2px;position:absolute;bottom:6px;left:11px;right:11px;background:var(--gold-line)}
.button{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:44px;padding:8px 15px;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink);font-weight:650;white-space:nowrap}
.button:hover{background:var(--soft)}
.button.main{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.button.main:hover{filter:brightness(1.08)}
.button.icononly{width:44px;padding:0}
.button.ghost{background:transparent}
.quiet{border:0;background:none;color:var(--ink);padding:0;min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.quiet:hover{text-decoration:underline;text-underline-offset:4px}
.theme-field{display:flex;align-items:center;gap:6px}
.theme-field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.theme-field select{min-height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 10px;border-radius:2px;font-weight:650}
.bottom-nav{display:none}
.kicker,.colophon,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.page{padding:28px 4% 36px;flex:1;position:relative}
.page-title{font:500 56px/1.02 var(--display);letter-spacing:-.05em}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.section-head p{color:var(--mute)}
.press-foot{margin-top:auto;padding:14px 4% 16px;display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--line)}

/* Home — oversized type, kinetic title, typographic goal */
.home-content{padding-top:22px}
.home-kicker{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:16px}
.kinetic{font:500 clamp(48px,7.2vw,96px)/.92 var(--display);letter-spacing:-.06em;max-width:8.2ch}
.kinetic .word{display:inline-block;white-space:nowrap}
.kinetic .ch{display:inline-block;opacity:0;transform:translateY(.28em);animation:letter-in .65s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*42ms)}
.app.is-static .kinetic .ch, .app.is-reduced .kinetic .ch{opacity:1;transform:none;animation:none}
@keyframes letter-in{to{opacity:1;transform:none}}
.home-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:8px 40px;align-items:start;margin-top:4px}
.home-copy .author{margin-top:14px;color:var(--mute);font:italic 22px/1.3 var(--display)}
.home-copy .metric{margin:20px 0 18px;max-width:260px}
.metric .labels{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:7px}
.meter{height:2px;background:var(--line);position:relative}
.meter>span{display:block;height:100%;background:var(--fill);transform-origin:left}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.hero-stage{min-height:320px;background:var(--art);display:grid;place-items:center;position:relative;overflow:hidden}
.hero-stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(240px 200px at 50% 42%,rgba(var(--lamp),.2),transparent 70%)}
.hero-stage:before{content:"";position:absolute;left:12%;right:12%;bottom:42px;height:20px;background:#00000055;border-radius:50%;filter:blur(8px);transform:translate(var(--sx,0),var(--sy,0))}
.object{width:230px;height:340px;position:relative;perspective:1100px}
.volume{width:186px;height:278px;margin:22px auto 0;position:relative;transform:rotateY(-26deg) rotateX(8deg) rotateZ(-9deg);transform-style:preserve-3d;transition:transform .18s ease-out}
.volume .cover{width:100%;height:100%;border-radius:2px 5px 5px 2px;box-shadow:-14px 8px 0 0 var(--c-spine,var(--cloth-2)), 18px 24px 32px #08060e80}
.spine{position:absolute;left:0;top:0;bottom:0;width:20px;background:var(--c-spine,var(--cloth-2));transform-origin:left center;transform:rotateY(90deg) translateX(-1px);box-shadow:inset -2px 0 0 #ffffff14, inset 3px 0 6px #00000033;z-index:2}
.fore-edge{position:absolute;right:-11px;top:3px;bottom:3px;width:11px;background:repeating-linear-gradient(to right,var(--page-edge) 0 1px,#d9d5e4 1px 2px);border-radius:0 2px 2px 0}
.bottom-edge{position:absolute;left:6px;right:-4px;bottom:-7px;height:7px;background:repeating-linear-gradient(var(--page-edge),var(--page-edge) 1px,#d4d0de 1px 2px);transform:skewX(-28deg);transform-origin:left}
.object-shadow{position:absolute;left:20px;right:6px;bottom:24px;height:24px;background:#00000066;border-radius:50%;filter:blur(10px);transform:translate(var(--sx,0),var(--sy,0))}
.hero-art{border:0;background:none;padding:0;color:inherit;width:100%;height:100%;display:grid;place-items:center}
.volume .bookmark{position:absolute;top:-2px;right:36px;width:9px;z-index:5;height:calc(14px + (var(--read,0) * .55px));background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),50% 100%,0 calc(100% - 8px));box-shadow:1px 2px 0 #00000033;pointer-events:none}
.volume .bookmark.is-tucked{height:10px;opacity:.55}
.volume .bookmark.is-gold,.volume.done .bookmark{background:var(--foil)}

.goal-type{padding:8px 0 4px}
.goal-type .goal-num{font:500 clamp(72px,10vw,128px)/.8 var(--display);letter-spacing:-.07em;margin:6px 0 8px}
.goal-type .goal-num span{font-size:.38em;color:var(--mute);letter-spacing:-.04em;margin-left:.12em}
.goal-rule{height:2px;background:var(--line);margin:12px 0 16px;max-width:280px;position:relative}
.goal-rule i{display:block;height:100%;background:var(--gold-line);width:0}
.app.is-static .goal-rule i, .app.is-reduced .goal-rule i{width:var(--goal,0%) !important}
.goal-rule i.is-on{width:var(--goal,0%);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.goal-type p.copy{color:var(--mute);font:italic 18px/1.4 var(--display);max-width:22em}
.goal-type .streak{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;max-width:280px;border-top:1px solid var(--line);padding-top:14px}
.goal-type .streak em{font:600 32px/1 var(--display);font-style:normal;letter-spacing:-.04em}

.home-index{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px;border-top:1px solid var(--ink);padding-top:18px}
.home-index h2{font:500 28px/1.1 var(--display);letter-spacing:-.03em;margin-bottom:12px}
.rank-item,.challenge-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;border-left:0;border-right:0}
.rank-item{cursor:pointer}
.rank-num{font:500 26px/1 var(--display);color:var(--gold);letter-spacing:-.04em}
.rank-item strong,.challenge-item strong{font:650 18px/1.25 var(--display);letter-spacing:-.02em;display:block}
.rank-item small,.challenge-item small{color:var(--mute)}
.challenge-item{grid-template-columns:minmax(0,1fr) auto;cursor:default}
.challenge-progress{font:500 22px/1 var(--display);white-space:nowrap}

/* Covers */
.cover{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:space-between;position:relative;isolation:isolate;overflow:hidden;border-radius:2px 4px 4px 2px;color:var(--c-fg);background:var(--c-bg);padding:11% 11% 9% 16%;container-type:inline-size;text-align:left;box-shadow:0 8px 16px #1710242e}
.cover:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3px,#0000000a 3px 4px);pointer-events:none;z-index:0;mix-blend-mode:multiply;opacity:.35}
.cover:after{content:"";position:absolute;top:0;bottom:0;left:0;width:7%;background:linear-gradient(90deg,#00000033,#0000 70%);z-index:2;pointer-events:none}
.cover-copy{z-index:1;display:flex;flex-direction:column;align-items:flex-start;position:relative}
.cover-author{font-size:5.4cqw;font-weight:700;text-transform:uppercase;letter-spacing:.11em;line-height:1.25;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover-title{font:600 16.2cqw/.95 var(--display);letter-spacing:-.065em;white-space:pre-line;margin-top:7%}
.cover-imprint{z-index:1;align-self:flex-end;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.8}
.cover-imprint b{width:16px;height:7px;border-block:1px solid currentColor;font-size:0}
.cover-imprint span{font-size:5.2cqw;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.cover-art{position:absolute;inset:0;pointer-events:none;z-index:0}
.cover-art i{position:absolute;display:block;border:1px solid currentColor;opacity:.45}
.reading{--c-bg:var(--cloth);--c-fg:#f4eefb;--c-spine:#26183f}
.done{--c-bg:#241a33;--c-fg:#e7c98a;--c-spine:#1a1326}
.later{--c-bg:var(--sheet);--c-fg:#2a1f3c;--c-spine:#c9c3d6}
.later .cover:before{opacity:.12;mix-blend-mode:normal}
.done .cover-title,.done .cover-author,.done .cover-imprint{color:var(--foil)}
.done .cover-art i{border-color:#e2c483;opacity:.55}
.later .cover{box-shadow:0 6px 14px #17102418;border:1px solid #d5d0e0}
.deep .cover-art i{border-radius:50%;width:90%;height:42%;left:28%;bottom:0;transform:rotate(-32deg)}
.deep .cover-art i:nth-child(2){bottom:6%;left:22%}
.deep .cover-art i:nth-child(3){bottom:12%;left:16%}
.deep .cover-art i:nth-child(4){bottom:18%;left:10%}
.deep .cover-art i:nth-child(5){bottom:24%;left:4%}
.prince .cover-art i{width:58%;aspect-ratio:1;border-radius:50%;bottom:9%;left:26%;transform:rotate(-22deg)}
.prince .cover-art i:nth-child(2){height:16%;width:80%;left:16%;bottom:22%;border-radius:0}
.orwell .cover-title{font-size:28cqw;letter-spacing:-.08em}
.orwell .cover-art i{left:18%;top:58%;width:64%;height:22%;border-radius:80% 10%;transform:rotate(16deg)}
.sapiens .cover-art i{width:68%;height:20%;left:20%;bottom:8%;border-radius:100% 0 70% 15%;transform:rotate(-34deg);background:currentColor;opacity:.16;border:0}
.think .cover-art i{width:62%;height:30%;bottom:10%;left:18%;transform:rotate(-22deg);border-radius:50%;border-width:2px}
.atomic .cover-art i{width:9%;aspect-ratio:1;border-radius:50%;left:34%;bottom:22%;background:currentColor;border:0;opacity:.55;box-shadow:16px 14px 0 currentColor,32px -6px 0 currentColor,10px -22px 0 currentColor}
.jobs .cover-art i{width:46%;height:36%;left:22%;bottom:10%;transform:rotate(24deg);background:currentColor;opacity:.16;border:0}
.musk .cover-art i{width:74%;height:30%;left:14%;bottom:10%;transform:rotate(-28deg);border-radius:50%}
.plain .cover-title{font-size:16cqw}
.plain .cover-art i{inset:8% 9%;border-style:solid}
.crime .cover-art i{width:70%;height:2px;left:15%;bottom:18%;border:0;background:currentColor;opacity:.45}
.master .cover-art i{width:40%;aspect-ratio:1;border-radius:50%;left:30%;bottom:12%}
.pride .cover-art i{width:64%;height:24%;left:18%;bottom:10%;border-radius:50% 50% 0 0}
.dune .cover-art i{width:80%;height:16%;left:10%;bottom:10%;border:0;background:currentColor;opacity:.14;border-radius:50%}
.war .cover-title{font-size:18cqw}
.war .cover-art i{width:72%;height:8%;left:14%;bottom:14%;border-width:2px 0 0;border-radius:0}
.rye .cover-art i{width:54%;height:28%;left:22%;bottom:10%;transform:rotate(16deg);border-radius:40% 10%}

/* Library toolbar */
.library-page{padding-bottom:0;display:flex;flex-direction:column;min-height:0;flex:1}
.library-page{padding-top:16px;padding-bottom:0}
.library-page .page-title{font-size:42px}
.library-page .section-head{margin-bottom:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.searchbox{flex:1 1 200px;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.searchbox input{border:0;background:none;width:100%;min-height:40px;outline:none;color:var(--ink)}
.chip,.sort{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:650;border-radius:2px}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.empty{padding:22px;border:1px solid var(--line);background:var(--panel);margin:12px 0}

/* Cinematic wall */
.wall-viewport{position:relative;flex:1;min-height:560px;overflow-x:auto;overflow-y:hidden;background:var(--wall);cursor:grab;border-top:1px solid #00000055;scrollbar-width:thin;scrollbar-color:var(--gold-line) transparent}
.wall-viewport:active{cursor:grabbing}
.wall-viewport.is-dragging{scroll-behavior:auto;cursor:grabbing;user-select:none}
.wall{position:relative;min-width:100%;width:max-content;padding:10px 24px 16px;display:flex;flex-direction:column;gap:10px}
.wall-cornice{height:14px;margin:0 0 4px;background:linear-gradient(180deg,var(--plank-shine),var(--cornice) 40%,var(--plank-edge));box-shadow:0 6px 10px #00000040;flex:none}
.wall-row{display:grid;grid-template-columns:52px minmax(0,auto);gap:10px;align-items:end;min-height:0}
.row-label{position:sticky;left:0;z-index:4;align-self:stretch;display:flex;align-items:end;justify-content:center;padding:0 0 22px;background:linear-gradient(90deg,var(--wall) 70%,transparent);writing-mode:vertical-rl;transform:rotate(180deg);font:700 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.row-label small{display:block;margin-top:8px;letter-spacing:.08em;color:#c8bfd6;font-weight:650;transform:rotate(180deg);writing-mode:horizontal-tb}
.shelf-well{background:linear-gradient(180deg,#00000033,transparent 40%),var(--well);box-shadow:inset 0 12px 20px #00000033;min-width:920px;position:relative}
.shelf-run{display:flex;align-items:flex-end;gap:3px;min-height:186px;padding:28px 16px 0;margin-bottom:-3px;position:relative;z-index:2}
.shelf-plank{height:16px;background:linear-gradient(180deg,var(--plank-shine) 0 2px,var(--plank) 30%,var(--plank-edge));box-shadow:0 10px 16px #00000055, inset 0 1px 0 #ffffff28, inset 0 -3px 0 #00000055;position:relative;z-index:1}
.shelf-plank:before{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:var(--gold-line);opacity:.28}
.bookend{flex:none;width:14px;height:78px;align-self:flex-end;margin:0 6px 0 2px;background:linear-gradient(90deg,#2a2438,#3a3348 45%,#241e32);box-shadow:2px 4px 8px #00000040, inset 1px 0 0 #ffffff18;clip-path:polygon(0 10px,100% 0,100% 100%,0 100%)}
.bookend-right{margin:0 2px 0 8px;clip-path:polygon(0 0,100% 10px,100% 100%,0 100%)}
.shelf-plaque{flex:none;align-self:flex-end;margin:0 0 18px 28px;padding:10px 14px;border:1px solid rgba(var(--lamp),.35);color:#e2c483;font:700 10px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.shelf-empty{color:#d6cfe0;padding:48px 20px 28px;font:italic 16px/1.4 var(--display)}
.wall-lamp{position:sticky;left:0;top:0;width:100%;height:0;pointer-events:none;z-index:6}
.wall-lamp i{position:absolute;left:0;top:0;width:100%;height:580px;background:radial-gradient(300px 260px at var(--lx,32%) var(--ly,34%),rgba(var(--lamp),.38),rgba(var(--lamp),.12) 38%,transparent 70%);mix-blend-mode:soft-light}

/* Spines */
.spine-book{--sw:28px;--sh:210px;--read:0;flex:0 0 var(--sw);width:var(--sw);height:var(--sh);border:0;padding:0;background:none;color:inherit;position:relative;transform-origin:bottom center;z-index:1;align-self:flex-end;transition:transform .28s ease, filter .28s ease, opacity .28s ease}
.spine-book:hover,.spine-book:focus-visible{z-index:5;transform:translateY(-12px) rotateZ(-1.6deg)}
.spine-book.is-open{opacity:.22;pointer-events:none;filter:grayscale(.3)}
.spine-book.is-dimmed{opacity:.2;pointer-events:none;transform:none;filter:grayscale(.3)}
.spine-book.is-lit .spine-face{box-shadow:inset 0 0 18px rgba(var(--lamp),.2), inset 1px 0 0 #ffffff33}
.spine-block{display:block;width:100%;height:100%;position:relative;box-shadow:2px 8px 12px #00000070, 1px 0 0 #00000050, -1px 0 0 #ffffff18}
.spine-face{position:absolute;inset:0;overflow:hidden;background:linear-gradient(90deg,#ffffff22,transparent 22%,transparent 76%,#00000040),repeating-linear-gradient(90deg,transparent 0 2px,#00000010 2px 3px),var(--c-bg);color:var(--c-fg);display:flex;flex-direction:column;align-items:center;padding:14px 2px 8px;gap:5px}
.spine-book.later .spine-face{box-shadow:inset 0 0 0 1px #ffffff80}
.spine-top{position:absolute;left:0;right:0;top:0;height:6px;z-index:2;background:repeating-linear-gradient(90deg,var(--c-spine,#1a1326) 0 3px,var(--foil) 3px 5px,var(--c-spine,#1a1326) 5px 8px)}
.spine-book.later .spine-top{background:repeating-linear-gradient(90deg,#c9c3d6 0 3px,#5b468a 3px 5px,#c9c3d6 5px 8px)}
.spine-pages{position:absolute;top:4px;bottom:2px;right:-3px;width:3px;background:repeating-linear-gradient(to right,var(--page-edge) 0 1px,#d4d0de 1px 2px)}
.spine-title{writing-mode:vertical-rl;transform:rotate(180deg);font:600 var(--title-size,12px)/1.05 var(--display);letter-spacing:var(--title-track,.04em);max-height:64%;max-width:calc(var(--sw) - 3px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:4px}
.spine-writer{writing-mode:vertical-rl;transform:rotate(180deg);font:700 7px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.8;max-height:18%;max-width:calc(var(--sw) - 3px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:auto}
.spine-stamp{display:none;margin-top:6px;width:13px;height:13px;flex:none;border-radius:50%;border:1px solid var(--foil);color:var(--foil);font:700 6px/13px var(--sans);text-align:center;background:#00000022}
.spine-book.done .spine-stamp{display:block}
.spine-book.is-thick .spine-face:before{content:"";position:absolute;left:0;right:0;top:22%;height:6px;pointer-events:none;z-index:2;background:linear-gradient(#00000033,#ffffff14,#00000033);box-shadow:0 34px 0 #00000022,0 68px 0 #00000022;opacity:.6}
.spine-book .ribbon{position:absolute;left:50%;top:0;z-index:3;pointer-events:none;width:clamp(6px,calc(var(--sw) * .36),9px);height:calc(12px + (var(--read,0) * .42px));transform:translate(-50%,-62%);background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),50% 100%,0 calc(100% - 6px));filter:drop-shadow(0 1px 1px #00000066)}
.spine-book.later .ribbon{height:10px;opacity:.55}
.spine-book.done .ribbon{background:var(--foil)}
.spine-book.just-finished .spine-stamp{animation:stamp-in .6s cubic-bezier(.2,.8,.2,1.2) both}
.shelf-bay.has-arrival .shelf-plank,.wall-row.has-arrival .shelf-plank{animation:plank-sheen 1.1s ease}
@keyframes stamp-in{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes plank-sheen{0%,100%{filter:none}40%{filter:brightness(1.35)}}
.spine-book.reading.tone-1{--c-bg:#322452}.spine-book.reading.tone-2{--c-bg:#41316c}.spine-book.reading.tone-3{--c-bg:#2a1e46}
.spine-book.done.tone-1{--c-bg:#22182e}.spine-book.done.tone-2{--c-bg:#1c1528}.spine-book.done.tone-3{--c-bg:#261c34}
.spine-book.later.tone-1{--c-bg:#ece8f4}.spine-book.later.tone-2{--c-bg:#e4dff0}.spine-book.later.tone-3{--c-bg:#f7f6fb}

/* Two-page spread */
.spread-layer{position:absolute;inset:0;z-index:9;background:#0c0914e6;display:flex;align-items:center;justify-content:center;padding:28px 4%;}
.spread-layer.is-entering{animation:fade-in .3s ease}
.spread-layer.is-leaving{opacity:0;transition:opacity .22s ease}
.spread{position:relative;width:min(980px,100%);perspective:1800px}
.spread-book{display:grid;grid-template-columns:1fr 1fr;transform-style:preserve-3d;box-shadow:0 28px 80px #00000099;background:var(--paper);color:#221832;position:relative}
.spread-book:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:28px;margin-left:-14px;pointer-events:none;z-index:3;background:linear-gradient(90deg,transparent,#22183214 35%,#22183226 50%,#22183214 65%,transparent)}

.leaf-left{border-right:1px solid #d8d3e3;transform-origin:right center;box-shadow:inset -10px 0 16px #22183212}

.spread-book.is-opening .leaf-left{animation:open-left .7s cubic-bezier(.2,.7,.2,1) both}
.spread-book.is-opening .leaf-right{animation:open-right .7s cubic-bezier(.2,.7,.2,1) both}
.app.is-static .spread-book.is-opening .leaf-left,.app.is-static .spread-book.is-opening .leaf-right,
.app.is-reduced .spread-book.is-opening .leaf-left,.app.is-reduced .spread-book.is-opening .leaf-right{animation:none}
@keyframes open-left{from{transform:rotateY(70deg);opacity:.6}to{transform:none;opacity:1}}

/* Journal — literary magazine */
.journal{padding-top:20px}
.issue-mast{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:28px}
.issue-mast .page-title{font-size:clamp(48px,8vw,92px);letter-spacing:-.06em}
.journal-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:48px;align-items:start}
.entries{border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:28px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
.entry-title{font:500 34px/1.12 var(--display);letter-spacing:-.04em}
.entry-meta{color:var(--mute);margin:8px 0 12px;font-size:13px}
.entry:first-of-type .entry-title::first-letter{float:left;font:500 78px/.7 var(--display);letter-spacing:-.06em;padding:6px 10px 0 0;color:var(--primary)}
.margin-note{font:italic 17px/1.5 var(--display);color:var(--ink);border-left:1px solid var(--gold-line);padding:2px 0 2px 14px}
.colophon-date{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:8px}
.entry-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.journal-aside .goal-type{border:1px solid var(--line);padding:18px 18px 16px;background:var(--panel)}

.reveal{opacity:0;transform:translateY(18px)}
.reveal.is-in{opacity:1;transform:none;transition:opacity .65s ease, transform .65s cubic-bezier(.2,.7,.2,1)}
.app.is-static .reveal,.app.is-reduced .reveal{opacity:1;transform:none;transition:none}

/* Year issue — magazine cover */
.issue-cover{min-height:calc(100% - 0px);display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.issue-cover .kicker{margin-bottom:8px}
.chapbook-year{font:500 clamp(88px,16vw,176px)/.78 var(--display);letter-spacing:-.08em}
.chapbook-lead{font:italic 24px/1.4 var(--display);color:var(--mute);margin:10px auto 0;max-width:22em}
.chapbook-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:40px 0 8px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);width:min(860px,100%)}
.stat-cell{padding:26px 12px;border-right:1px solid var(--line)}
.stat-cell:last-child{border-right:0}

.stat-cell span{display:block;margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.chapbook-pair{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 34px;border-bottom:1px solid var(--line);width:min(860px,100%)}

/* Dialogs */
dialog{width:min(92%,480px);max-height:89vh;overflow:auto;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink);box-shadow:0 22px 60px #160e2766}
dialog::backdrop{background:#0c0914cc}
.dialog-shell{padding:22px 22px 20px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:14px}
.dialog-head h2{font:550 28px/1.1 var(--display);letter-spacing:-.035em;margin-top:4px}
.detail-note{margin:14px 0;color:var(--mute);font:italic 16px/1.45 var(--display)}
.field{display:grid;gap:5px;margin-bottom:12px;font-weight:650}
.field input,.field select,.field textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink)}
.field textarea{min-height:88px;resize:vertical;line-height:1.4}
.dialog-shell .actions{justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:26px;z-index:20;transform:translateX(-50%);background:#322452;color:#fff;border-radius:2px;padding:11px 16px;max-width:calc(100% - 32px);box-shadow:0 8px 22px #1d152540}
.toast:empty{display:none}

/* Page turn */
.page-turn-layer{position:absolute;inset:0;z-index:8;perspective:1600px;pointer-events:none;overflow:hidden}
.page-ghost{transform-origin:left center;background:var(--paper);height:100%;overflow:hidden;box-shadow:12px 0 30px #00000033}
.page-turn-layer.is-turning .page-ghost{transform:rotateY(-88deg);opacity:0;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .45s ease .12s}
.page.is-enter{animation:page-in .55s ease both}
.app.is-static .page.is-enter,.app.is-reduced .page.is-enter{animation:none}
@keyframes page-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

const escape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const ART_MAP = {

  'идиот':'crime','среднощни деца':'plain'
};
function artOf(book){ return ART_MAP[(book.title || '').toLowerCase()] || 'plain'; }
function coverTitle(book){
  const t = book.title || '';
  if (t.length <= 10) return t;
  const mid = t.lastIndexOf(' ', Math.ceil(t.length/2));
  return mid > 0 ? t.slice(0,mid) + '\n' + t.slice(mid+1) : t;
}
function toneOf(book){ return [...String(book.title)].reduce((s,c)=>s+c.charCodeAt(0),0) % 4; }
function spineWidth(book){
  const p = Number(book.totalPages) || 200;
  const t = Math.min(1, Math.max(0, (p - 80) / (1100 - 80)));
  return Math.round(18 + t * 40);
}
function spineHeight(book){
  const p = Number(book.totalPages) || 200;
  const n = [...String(book.title)].reduce((s,c)=>s+c.charCodeAt(0),0);
  return 168 + (n % 20) + Math.round(Math.min(16, p / 90));
}
function spineTitleFit(book, w, h){
  const t = book.title || '';
  const avail = Math.max(36, h * 0.62);
  const maxPx = Math.min(15, Math.max(8.5, w * 0.46));
  const fit = avail / Math.max(t.length * 0.95, 1);
  const size = Math.max(8, Math.min(maxPx, fit));
  const track = t.length > 24 ? '0.02em' : t.length > 16 ? '0.03em' : '0.05em';
  return {size, track, long: t.length > 20};
}
function spineAuthor(book){
  const a = book.author || '';
  if (a.length <= 16) return a;
  const parts = a.split(' ').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : a;
}

}

function todayISO(){
  const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function statusOf(book){ return book.currentPage >= book.totalPages ? 'done' : book.currentPage > 0 ? 'reading' : 'later'; }
function statusLabel(s){ return s==='done'?'Прочетена':s==='reading'?'Чета':'За четене'; }
function progress(book){ return book.totalPages ? Math.round(book.currentPage/book.totalPages*100) : 0; }
function findBook(id){ return books.find(b => b.id === Number(id)); }
function prefersReduced(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function isMotionless(){ return prefersReduced() || state.static; }
function startOfWeek(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d;
}
function weekPages(){
  const start=startOfWeek(new Date());
  const iso=new Date(start.getTime()-start.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return logs.filter(l=>l.dateISO>=iso).reduce((s,l)=>s+l.pages,0);
}
function pagesByDay(){
  const map={};
  logs.forEach(l=>{ map[l.dateISO]=(map[l.dateISO]||0)+l.pages; });
  return map;
}
function currentStreak(){
  const map=pagesByDay();
  const min=settings.minPagesForStreakDay;
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    if((map[iso]||0)>=min){ n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function longestStreak(){
  const map=pagesByDay();
  const days=Object.keys(map).filter(k=>map[k]>=settings.minPagesForStreakDay).sort();
  let best=0,run=0,prev=null;
  days.forEach(iso=>{
    if(prev){
      const a=new Date(prev+'T12:00:00'), b=new Date(iso+'T12:00:00');
      const diff=Math.round((b-a)/86400000);
      run = diff===1 ? run+1 : 1;
    } else run=1;
    best=Math.max(best,run); prev=iso;
  });
  return best;
}
function bookLogs(book){
  return logs.filter(l=>l.bookId===book.id).sort((a,b)=>b.dateISO.localeCompare(a.dateISO)||String(b.id).localeCompare(String(a.id)));
}

  return '<div class="metric"><div class="labels"><span>'+book.currentPage+' от '+book.totalPages+' стр.</span>'+(showPercent?'<span>'+progress(book)+'%</span>':'')+'</div>'+meter(progress(book),'Напредък по книгата')+'</div>';
}
function kineticTitle(text){
  let i=0;
  const html=String(text).split(/(\s+)/).map(token=>{
    if(/^\s+$/.test(token)){ const s='<span class="ch space" style="--i:'+i+'" aria-hidden="true">&nbsp;</span>'; i++; return s; }
    const letters=[...token].map(ch=>{ const s='<span class="ch" style="--i:'+i+'" aria-hidden="true">'+escape(ch)+'</span>'; i++; return s; }).join('');
    return '<span class="word">'+letters+'</span>';
  }).join('');
  return '<h1 class="kinetic" tabindex="-1" aria-label="'+escape(text)+'">'+html+'</h1>';
}

function currentBook(){
  const reading=new Set(books.filter(b=>statusOf(b)==='reading').map(b=>b.id));
  const recent=[...logs].sort((a,b)=>b.dateISO.localeCompare(a.dateISO)||String(b.id).localeCompare(String(a.id)));
  for(const log of recent){
    const book=findBook(log.bookId);
    if(book && reading.has(book.id)) return book;
  }
  return books.find(b=>statusOf(b)==='reading') || books[0];
}
function goalBlock(compact){
  const pages=weekPages();
  const goal=settings.weeklyGoalPages;
  const left=Math.max(0,goal-pages);
  const streak=currentStreak();
  const pct=Math.round(pages/goal*100);
  const detail = pages>=goal ? 'Седмичната цел е изпълнена.' : 'Още '+left+' страници до целта.';
  return '<section class="goal-type'+(compact?' is-compact':'')+'" aria-label="Седмична цел и серия">'+
    '<p class="kicker">Седмична цел</p>'+
    '<p class="goal-num">'+pages+'<span>/'+goal+'</span></p>'+
    '<div class="goal-rule" role="progressbar" aria-label="Седмична цел" aria-valuenow="'+Math.min(pct,100)+'" aria-valuemin="0" aria-valuemax="100" style="--goal:'+Math.min(pct,100)+'%"><i></i></div>'+
    '<p class="copy">'+detail+'</p>'+
    '<div class="streak"><span class="kicker">Серия</span><em>'+streak+' дни</em></div>'+
  '</section>';
}

function matchesQuery(book){
  const q=state.query.trim().toLocaleLowerCase('bg');
  if(!q) return true;
  return (book.title+' '+book.author).toLocaleLowerCase('bg').includes(q);
}
function matchesFilter(book){ return state.filter==='all' || state.filter===statusOf(book); }
function sortBooks(list){
  const copy=[...list];
  if(state.sort==='progress') copy.sort((a,b)=>progress(b)-progress(a)||a.title.localeCompare(b.title,'bg'));
  else if(state.sort==='title') copy.sort((a,b)=>a.title.localeCompare(b.title,'bg'));
  else copy.sort((a,b)=>b.id-a.id);
  return copy;
}

function formatDateBG(iso){
  const today=todayISO();
  if(iso===today) return 'Днес';
  const yest=isoDaysAgo(1);
  if(iso===yest) return 'Вчера';
  const [y,m,d]=iso.split('-');
  return Number(d)+' '+MONTHS[Number(m)-1]+' '+y;
}

function yearStats(){
  const year='2026';
  const yearLogs=logs.filter(l=>l.dateISO.startsWith(year));
  const pages=yearLogs.reduce((s,l)=>s+l.pages,0);
  const finished=books.filter(b=>statusOf(b)==='done');
  const byAuthor={};
  yearLogs.forEach(l=>{
    const b=findBook(l.bookId); if(!b) return;
    byAuthor[b.author]=(byAuthor[b.author]||0)+l.pages;
  });
  const fav=Object.entries(byAuthor).sort((a,b)=>b[1]-a[1])[0];
  const byMonth={};
  yearLogs.forEach(l=>{ const m=Number(l.dateISO.slice(5,7)); byMonth[m]=(byMonth[m]||0)+l.pages; });
  const best=Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0];
  return {
    pages, finished,
    favAuthor: fav?fav[0]:'—',
    bestMonth: best?MONTHS[Number(best[0])-1]:'—',
    streak: Math.max(currentStreak(), longestStreak())
  };
}

function openBook(id, source, animate=true){
  const book=findBook(id);
  if(!book) return;
  const fromLibrary=state.screen==='library' && document.getElementById('wall');
  const first=document.querySelector('.spine-book[data-id="'+book.id+'"]');
  const firstRect=first?.getBoundingClientRect();
  state.openId=book.id;
  if(state.screen!=='library'){
    goTo('library', {skipTurn:true});
    document.querySelector('#spread-title')?.focus();
    return;
  }
  first?.setAttribute('aria-expanded','true');
  first?.classList.add('is-open');
  document.querySelector('.spread-layer')?.remove();
  const page=document.querySelector('.library-page') || document.querySelector('.page');
  page.insertAdjacentHTML('beforeend', spreadHTML(book, animate && !isMotionless()));
  const layer=document.querySelector('.spread-layer');
  if(animate && !isMotionless() && firstRect){
    const left=layer.querySelector('.leaf-left');
    const lastRect=left.getBoundingClientRect();
    const flyer=document.createElement('div');
    flyer.className='inspect-flyer';
    flyer.innerHTML=bookObject(book);
    flyer.style.cssText='position:fixed;left:'+firstRect.left+'px;top:'+firstRect.top+'px;width:'+Math.max(firstRect.width,24)+'px;height:'+firstRect.height+'px;z-index:12;pointer-events:none;transition:left .55s cubic-bezier(.2,.7,.2,1),top .55s cubic-bezier(.2,.7,.2,1),width .55s cubic-bezier(.2,.7,.2,1),height .55s cubic-bezier(.2,.7,.2,1)';
    document.body.appendChild(flyer);
    requestAnimationFrame(()=>{
      flyer.style.left=lastRect.left+'px';
      flyer.style.top=lastRect.top+'px';
      flyer.style.width=Math.max(120, lastRect.width*0.45)+'px';
      flyer.style.height=lastRect.height+'px';
      setTimeout(()=>flyer.remove(), 700);
    });
  }
  layer.querySelector('#spread-title')?.focus();
  opener=source||first;
  syncHash();
}
function closeSpread(animate=true){
  const id=state.openId;
  const layer=document.querySelector('.spread-layer');
  state.openId=null;
  const spine=id && document.querySelector('.spine-book[data-id="'+id+'"]');
  const done=()=>{
    layer?.remove();
    spine?.classList.remove('is-open');
    spine?.setAttribute('aria-expanded','false');
    spine?.focus();
    syncHash();
  };
  if(!layer){ done(); return; }
  if(!animate || isMotionless()){ done(); return; }
  layer.classList.add('is-leaving');
  setTimeout(done, 220);
}
function finishBook(book, opts={}){
  if(!book || statusOf(book)==='done') return;
  const remaining=book.totalPages-book.currentPage;
  if(remaining>0 && opts.addLog!==false){
    logs.unshift({id:'l-'+Date.now(), bookId:book.id, dateISO:todayISO(), pages:remaining, note:opts.note || (opts.demo?'Демо: книгата е завършена.':'Последна сесия.')});
    book.currentPage=book.totalPages;
  } else {
    book.currentPage=book.totalPages;
  }
  state.openId=null;
  document.getElementById('dialog')?.close();
  const first=document.querySelector('.spine-book[data-id="'+book.id+'"]');
  const firstRect=first?.getBoundingClientRect();
  const stay=state.screen==='library';
  if(!stay) goTo('library', {skipTurn:true});
  else {
    document.querySelector('.spread-layer')?.remove();
    const r=document.getElementById('results');
    if(r){ r.innerHTML=libraryResultsHTML(); bindWall(); }
  }
  const last=document.querySelector('.spine-book[data-id="'+book.id+'"]');
  const row=last?.closest('.wall-row');
  last?.classList.add('just-finished');
  row?.classList.add('has-arrival');
  last?.setAttribute('aria-expanded','false');
  if(!isMotionless() && firstRect && last && firstRect.width>0){
    const lastRect=last.getBoundingClientRect();
    const dx=firstRect.left-lastRect.left;
    const dy=firstRect.top-lastRect.top;
    last.style.zIndex='9';
    last.style.transform='translate('+dx+'px, '+dy+'px)';
    last.style.transition='none';
    last.getBoundingClientRect();
    last.style.transition='transform .95s cubic-bezier(.2,.7,.2,1)';
    last.style.transform='translate(0,0)';
    const clear=()=>{ last.style.transition=''; last.style.transform=''; last.style.zIndex=''; };
    last.addEventListener('transitionend', clear, {once:true});
    setTimeout(clear, 1100);
  }
  flash('„'+book.title+'“ е прочетена.');
  const live=document.getElementById('live');
  if(live) live.textContent='Книгата „'+book.title+'“ е отбелязана като прочетена и е преместена на рафта Прочетени.';
  syncHash();
}

function bindHeroTilt(){
  const art=document.querySelector('.hero-art');
  const vol=art?.querySelector('.volume');
  const stage=art?.querySelector('.hero-stage');
  if(!art || !vol || isMotionless()) return;
  const apply=(x,y)=>{
    vol.style.transform='rotateY('+(-26+x*18)+'deg) rotateX('+(8-y*10)+'deg) rotateZ(-9deg)';
    stage?.style.setProperty('--sx', (x*16)+'px');
    stage?.style.setProperty('--sy', (y*10)+'px');
  };
  art.addEventListener('pointermove', e=>{
    const r=art.getBoundingClientRect();
    apply((e.clientX-r.left)/r.width-0.5, (e.clientY-r.top)/r.height-0.5);
  });
  art.addEventListener('pointerleave', ()=>{ vol.style.transform=''; stage?.style.setProperty('--sx','0px'); stage?.style.setProperty('--sy','0px'); });
}
function bindWall(){
  const wall=document.getElementById('wall');
  if(!wall) return;
  const lamp=wall.querySelector('.wall-lamp i') || wall.querySelector('.wall-lamp');
  const setLamp=(lx,ly)=>{
    const target=wall.querySelector('.wall-lamp i') || wall;
    target.style.setProperty('--lx', lx);
    target.style.setProperty('--ly', ly);
  };
  setLamp(state.static?'32%':'28%', state.static?'36%':'32%');
  wall.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY)>=Math.abs(e.deltaX)){
      e.preventDefault();
      wall.scrollLeft += e.deltaY;
    }
  }, {passive:false});
  let dragging=false, startX=0, startLeft=0;
  wall.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(e.target.closest('button,input,select,a')) return;
    dragging=true; startX=e.clientX; startLeft=wall.scrollLeft;
    wall.classList.add('is-dragging');
    wall.setPointerCapture?.(e.pointerId);
  });
  wall.addEventListener('pointermove', e=>{
    if(dragging){ wall.scrollLeft = startLeft - (e.clientX-startX); }
    if(isMotionless()) return;
    const r=wall.getBoundingClientRect();
    setLamp(((e.clientX-r.left)/r.width*100).toFixed(2)+'%', ((e.clientY-r.top)/r.height*100).toFixed(2)+'%');
  });
  const endDrag=()=>{ dragging=false; wall.classList.remove('is-dragging'); };
  wall.addEventListener('pointerup', endDrag);
  wall.addEventListener('pointercancel', endDrag);
  wall.addEventListener('pointerleave', ()=>{ if(!state.static) setLamp('28%','32%'); });
}
function bindReveals(){
  const nodes=[...document.querySelectorAll('.reveal')];
  if(!nodes.length) return;
  if(isMotionless()){ nodes.forEach(n=>n.classList.add('is-in')); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('is-in'); io.unobserve(en.target); } });
  }, {threshold:0.16, rootMargin:'0px 0px -8% 0px'});
  nodes.forEach(n=>io.observe(n));
}
function bindCountUp(){
  const cells=[...document.querySelectorAll('[data-count]')];
  if(!cells.length) return;
  const run=()=>{
    cells.forEach(el=>{
      const target=Number(el.dataset.count);
      if(isMotionless()){ el.textContent = target.toLocaleString('bg-BG'); return; }
      const start=performance.now();
      const dur=1100;
      const tick=now=>{
        const t=Math.min(1,(now-start)/dur);
        const eased=1-Math.pow(1-t,3);
        el.textContent=Math.round(target*eased).toLocaleString('bg-BG');
        if(t<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  };
  run();
}
function bindGoalRule(){
  document.querySelectorAll('.goal-rule i').forEach(i=>{
    if(isMotionless()) return;
    requestAnimationFrame(()=>i.classList.add('is-on'));
  });
}

function parseHash(){
  const params=new URLSearchParams(location.search);
  if(params.has('static') || params.get('shot')==='1') state.static=true;
  const raw=decodeURIComponent((location.hash||'').replace(/^#/,'')).toLowerCase();
  if(!raw) return;
  raw.split(/[-_/,+\s]+/).filter(Boolean).forEach(bit=>{
    if(bit==='activity' || bit==='дневник' || bit==='diary') state.screen='journal';
    else if(bit==='issue' || bit==='broy' || bit==='брой' || bit==='year') state.screen='issue';
    else if(bit==='library' || bit==='библиотека' || bit==='home' || bit==='начало' || bit==='journal') state.screen = bit==='библиотека'?'library':bit==='начало'?'home':bit==='journal'?'journal':bit;
    else if(bit==='open'){ state.screen='library'; state.openId = state.openId || (currentBook()&&currentBook().id); }
    else if(bit==='finish'){ state.screen='library'; state.pendingFinish=true; }
    else if(bit==='final' || bit==='static') state.static=true;
    else if(bit==='dark') { state.theme='dark'; settings.theme='dark'; }
    else if(bit==='light') { state.theme='light'; settings.theme='light'; }
    else if(bit==='system') { state.theme='system'; settings.theme='system'; }
    else if(bit==='mobile' || bit==='phone') state.device='phone';
    else if(bit==='desktop') state.device='desktop';
  });
}
function syncHash(){
  const parts=[state.screen];
  if(state.openId) parts.push('open');
  if(state.finishShot) parts.push('finish');
  if(state.static) parts.push('final');
  if(state.theme==='dark') parts.push('dark');
  if(state.theme==='system') parts.push('system');
  if(state.device==='phone') parts.push('mobile');
  const next='#'+parts.join('-');
  if(location.hash!==next){
    syncingHash=true;
    history.replaceState(null,'',next);
    syncingHash=false;
  }
}
function applyPendingFinishData(){
  if(!state.pendingFinish) return;
  const book=books.find(b=>b.id===3);
  state.pendingFinish=false;
  if(!book) return;
  if(statusOf(book)!=='done'){
    const remaining=book.totalPages-book.currentPage;
    if(remaining>0){
      logs.unshift({id:'l-'+Date.now(), bookId:book.id, dateISO:todayISO(), pages:remaining, note:'Демо: книгата е завършена.'});
      book.currentPage=book.totalPages;
    }
  }
  state.finishShot=book.id;
}
function afterRender(){
  bindHeroTilt();
  bindWall();
  bindReveals();
  bindCountUp();
  bindGoalRule();
  if(state.finishShot){
    const el=document.querySelector('.spine-book[data-id="'+state.finishShot+'"]');
    el?.classList.add('just-finished');
    el?.closest('.wall-row')?.classList.add('has-arrival');
    const book=findBook(state.finishShot);
    if(book && !state.finishAnnounced){
      state.finishAnnounced=true;
      flash('„'+book.title+'“ е прочетена.');
    }
  }
}
function screenHTML(){
  return state.screen==='library'?libraryPage():state.screen==='journal'?journalPage():state.screen==='issue'?issuePage():homePage();
}
function paint(){
  const stage=document.getElementById('stage');
  stage.classList.toggle('phone', state.device==='phone');
  stage.innerHTML='<div class="'+appClass()+'">'+appHeader()+screenHTML()+
    '<nav class="bottom-nav" aria-label="Мобилна навигация">'+nav(true)+'</nav>'+
    pressFoot()+'<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="live" class="sr" aria-live="polite"></div></div>';
  document.querySelectorAll('[data-device]').forEach(btn=>btn.setAttribute('aria-pressed', String(btn.dataset.device===state.device)));
  syncHash();
  afterRender();
}
function render(){ paint(); }

function goTo(screen, opts={}){
  if(screen===state.screen && !opts.force){
    document.querySelector('.page-title, h1')?.focus({preventScroll:true});
    return;
  }
  const reduce=isMotionless() || opts.skipTurn;
  const app=document.querySelector('.app');
  const page=app?.querySelector('main.page');
  if(!reduce && app && page && !turning){
    turning=true;
    const ghost=page.cloneNode(true);
    ghost.classList.add('page-ghost');
    ghost.setAttribute('aria-hidden','true');
    const layer=document.createElement('div');
    layer.className='page-turn-layer';
    layer.appendChild(ghost);
    state.openId=null;
    state.screen=screen;
    paint();
    const nextApp=document.querySelector('.app');
    nextApp.appendChild(layer);
    nextApp.querySelector('main.page')?.classList.add('is-enter');
    requestAnimationFrame(()=>layer.classList.add('is-turning'));
    setTimeout(()=>{ layer.remove(); turning=false; }, 720);
    document.querySelector('.page-title, h1, .kinetic')?.focus({preventScroll:true});
    return;
  }
  state.openId = (screen==='library' && opts.keepOpen) ? state.openId : null;
  state.screen=screen;
  paint();
  document.querySelector('.page-title, h1, .kinetic')?.focus({preventScroll:true});
}

document.addEventListener('click', event=>{
  const closeHit=event.target.closest('[data-close-spread]');
  if(closeHit && !event.target.closest('.spread button, .spread a, .spread input, .spread select, .spread textarea, .leaf')){
    const onLayer=closeHit.classList.contains('spread-layer');
    if(!onLayer || event.target===closeHit){ closeSpread(); return; }
  }
  if(closeHit && (closeHit.classList.contains('spread-close') || closeHit.hasAttribute('data-close-spread') && !closeHit.classList.contains('spread-layer'))){
    if(!closeHit.classList.contains('spread-layer')){ closeSpread(); return; }
  }
  const btn=event.target.closest('button');
  if(!btn) return;
  const data=btn.dataset;
  if(data.device){ state.device=data.device; paint(); }
  else if(data.nav){ goTo(data.nav); }
  else if(data.filter){ state.filter=data.filter; if(state.screen==='library') refreshLibraryResults(); else paint(); }
  else if('reset' in data){ state.query=''; state.filter='all'; if(state.screen==='library'){ const s=document.getElementById('search'); if(s) s.value=''; refreshLibraryResults(); } else paint(); document.getElementById('search')?.focus(); }
  else if(data.openBook){ openBook(data.openBook, btn, true); }
  else if(data.detail){ openBook(data.detail, btn, state.screen==='library'); }
  else if(data.log){ showLog(findBook(data.log), btn); }
  else if(data.editLog){ const log=logs.find(l=>String(l.id)===String(data.editLog)); if(log) showEditLog(log,btn); }
  else if(data.edit){ const book=findBook(data.edit); if(book) showEdit(book,btn); }
  else if(data.finish){ const book=findBook(data.finish); if(book) finishBook(book,{demo:true}); }
  else if('add' in data){ showAdd(btn); }
  else if('settings' in data){ showSettings(btn); }
  else if('close' in data){ document.getElementById('dialog')?.close(); }
});
document.addEventListener('keydown', event=>{
  if(event.key!=='Escape') return;
  const dialog=document.getElementById('dialog');
  if(dialog?.open) return;
  if(state.openId){ event.preventDefault(); closeSpread(); }
});
document.addEventListener('input', event=>{
  if(event.target.id==='search'){ state.query=event.target.value; if(state.screen==='library') refreshLibraryResults(); }
  if(event.target.id==='sort'){ state.sort=event.target.value; if(state.screen==='library') refreshLibraryResults(); }
  if(event.target.id==='themeSelect'){ state.theme=event.target.value; settings.theme=state.theme; paint(); }
});
document.addEventListener('submit', event=>{
  event.preventDefault();
  const form=event.target;
  const data=new FormData(form);
  if(form.id==='log-form'){
    const book=findBook(form.dataset.book);
    const pages=Number(data.get('pages'));
    if(!book || pages<1){ flash('Въведи страниците от сесията.'); return; }
    const remaining=book.totalPages-book.currentPage;
    const add=Math.min(pages, remaining);
    const completes=add>=remaining && remaining>0;
    book.currentPage=Math.min(book.totalPages, book.currentPage+add);
    logs.unshift({id:'l-'+Date.now(), bookId:book.id, dateISO:data.get('date')||todayISO(), pages:add, note:(data.get('note')||'').slice(0,120)});
    document.getElementById('dialog').close();
    if(completes) finishBook(book,{addLog:false});
    else { paint(); flash('Сесията е записана.'); }
  } else if(form.id==='edit-log-form'){
    const log=logs.find(l=>String(l.id)===String(form.dataset.log));
    const book=log && findBook(log.bookId);
    if(!log||!book){ flash('Сесията не е намерена.'); return; }
    const pages=Number(data.get('pages'));
    const delta=pages-log.pages;
    book.currentPage=Math.max(0, Math.min(book.totalPages, book.currentPage+delta));
    log.pages=pages; log.dateISO=data.get('date')||log.dateISO; log.note=(data.get('note')||'').slice(0,120);
    const justDone = delta>0 && book.currentPage>=book.totalPages;
    document.getElementById('dialog').close();
    if(justDone) finishBook(book,{addLog:false});
    else { paint(); flash('Сесията е обновена.'); }
  } else if(form.id==='add-form'){
    const title=(data.get('title')||'').trim();
    const author=(data.get('author')||'').trim();
    const totalPages=Number(data.get('totalPages'));
    let currentPage=Number(data.get('currentPage')||0);
    if(!title||!author||!(totalPages>=1)){ flash('Въведи заглавие, автор и страници.'); return; }
    if(currentPage<0) currentPage=0;
    if(currentPage>totalPages) currentPage=totalPages;
    books.unshift({id:Date.now(), title, author, totalPages, currentPage, notes:(data.get('notes')||'').trim().slice(0,300), createdAt:new Date().toISOString()});
    state.filter='all'; state.query=''; state.openId=null;
    document.getElementById('dialog').close();
    goTo('library', {force:true, skipTurn:true});
    flash('Книгата е добавена в библиотеката.');
  } else if(form.id==='edit-form'){
    const book=findBook(form.dataset.book);
    if(!book){ flash('Книгата не е намерена.'); return; }
    const title=(data.get('title')||'').trim();
    const author=(data.get('author')||'').trim();
    const totalPages=Number(data.get('totalPages'));
    let currentPage=Number(data.get('currentPage')||0);
    if(!title||!author||!(totalPages>=1)){ flash('Въведи заглавие, автор и страници.'); return; }
    if(currentPage<0) currentPage=0;
    if(currentPage>totalPages) currentPage=totalPages;
    book.title=title; book.author=author; book.totalPages=totalPages; book.currentPage=currentPage;
    book.notes=(data.get('notes')||'').trim().slice(0,300);
    document.getElementById('dialog').close(); paint(); flash('Книгата е обновена.');
  } else if(form.id==='settings-form'){
    settings.weeklyGoalPages=Math.max(1, parseInt(data.get('weeklyGoalPages'),10)||100);
    settings.minPagesForStreakDay=Math.max(1, parseInt(data.get('minPagesForStreakDay'),10)||1);
    state.theme=data.get('theme')||state.theme;
    settings.theme=state.theme;
    document.getElementById('dialog').close(); paint(); flash('Настройките са запазени.');
  }
});
window.addEventListener('hashchange', ()=>{ if(syncingHash) return; parseHash(); applyPendingFinishData(); paint(); });

window.__errors=[];
window.addEventListener('error', e => window.__errors.push(String(e.message||e)));
window.addEventListener('unhandledrejection', e => window.__errors.push(String(e.reason||e)));
parseHash();
applyPendingFinishData();
paint();
document.documentElement.setAttribute('data-js-errors', JSON.stringify(window.__errors));

</script>
</body>
